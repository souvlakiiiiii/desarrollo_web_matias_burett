<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">

    <style>
        #initial_opacity_zero{
            display: none;
            opacity: 0;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,.8);
            z-index: 9998;
            pointer-events: none;
            transition: opacity .2s ease;
        }

        p {
            text-align: center;
        }

        h3 {
            text-align: center;
            text-decoration: underline black;
        }

        body {
            background-color: lightblue;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        body > div {
            text-align: center;
            margin: 20px 0;
            max-width: 600px;
        }
    </style>

    <title>Mascotas primera fila</title>

</head>

<body>
    <div class="container">
        <div>
            <h3>Fecha publicación</h3>
            <span>2025-07-11, 12:15</span>
        </div>
        <br><br>
        <div>
            <h3>Fecha entrega</h3>
            <span>2025-08-24, 14:00</span>
        </div>
        <br><br>
        <div>
            <h3>Comuna</h3>
            <span>Ñuñoa</span>
        </div>
        <br><br>
        <div>
            <h3>Sector</h3>
            <span>Plaza</span>
        </div>
        <br><br>
        <div>
            <h3>Cantidad/Tipo/Edad</h3>
            <span>2 gatos, 3 meses</span>
        </div>
        <br><br>
        <div>
            <h3>Nombre contacto</h3>
            <span>Billy Corgan</span>
        </div>
        <br><br>
        <div>
            <h3>Fotos</h3>
            <span><img src="../fotos/gato1.jpg" height="240" width="320" onclick='agrandarFotos("gato1")' id="gato1"
                alt="Foto de la primera mascota, un gato"> 
                <img src="../fotos/gato2.jpg" height="240" width="320" onclick='agrandarFotos("gato2")'
                id="gato2" alt="Foto de la segunda mascota, un gato"></span>
        </div>
        <br><br>
        <div id="initial_opacity_zero"></div>
        <script src="../js/fotosListado.js"></script>
        <p><a href="../html/index.html">Volver a la página principal</a></p>
    </div>
</body>
</html>
